<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Duty Dashboard (Idea Demo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(135deg, #eef2ff 0%, #f4f6f8 60%);
      margin:0; padding:24px; min-height:100vh;
    }
    .card{
      max-width:1100px; margin:auto; background:#fff;
      border-radius:16px; padding:0;
      box-shadow: 0 4px 6px rgba(0,0,0,.04), 0 20px 40px rgba(0,0,0,.09);
      overflow:hidden;
    }
    .card-header{
      padding:20px 24px 14px;
      border-bottom:1px solid #ede9fe;
      background: linear-gradient(100deg, #f5f3ff 0%, #fff 60%);
    }
    h1{
      font-size:22px; margin:0 0 3px 0;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .muted{ color:#888; font-size:12px; margin:0; }
    #app{ padding:12px 16px 16px; }

    .row{
      display:grid;
      grid-template-columns: 26px 1fr auto;
      align-items:center;
      padding:6px 8px;
      border-radius:8px;
      user-select:none;
      transition: background 0.12s;
    }
    .row:hover{ background:#f3f4f8; }
    .row.clickable{ cursor:pointer; }
    .row.indent-0{
      box-shadow: inset 3px 0 0 #8b5cf6;
      background: #faf7ff;
      border-radius:0 8px 8px 0;
      margin-bottom:2px;
    }
    .row.indent-0:hover{ background:#f3edff; }

    .indent-0{ padding-left:4px; }
    .indent-1{ padding-left:18px; }
    .indent-2{ padding-left:36px; }
    .indent-3{ padding-left:54px; }
    .indent-4{ padding-left:72px; }

    .chev{
      width:22px; height:22px;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; color:#9ca3af;
      transition: transform 0.2s, color 0.2s;
    }
    .chev.open{ transform:rotate(90deg); color:#6366f1; }

    .title{ font-weight:800; color:#111; font-size:15px; }
    .subtitle{ font-weight:600; color:#333; display:flex; align-items:center; }

    .metrics{
      font-size:12px;
      white-space:nowrap;
      display:flex; gap:6px;
    }
    .chip{
      display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:800;
      padding:2px 4px; border-radius:999px;
      border:1px solid;
      box-sizing:border-box;
    }
    .chip-wd{ color:#15803d; background:#f0fdf4; border-color:#bbf7d0; width:72px; }
    .chip-we{ color:#b45309; background:#fffbeb; border-color:#fde68a; width:72px; }
    .chip-ph{ color:#b91c1c; background:#fef2f2; border-color:#fecaca; width:104px; }

    .col-header{
      display:grid;
      grid-template-columns: 26px 1fr auto;
      padding:2px 8px 6px;
      border-bottom:1px solid #f0f0f0; margin-bottom:4px;
    }
    .col-header-labels{
      display:flex; gap:6px;
    }
    .col-header-labels span{
      text-align:center;
      font-size:11px; font-weight:700;
      box-sizing:border-box;
    }
    .col-wd{ color:#15803d; width:72px; }
    .col-we{ color:#b45309; width:72px; }
    .col-ph{ color:#b91c1c; width:104px; }

    .children{ margin:2px 0 4px 0; }
    .hidden{ display:none; }

    .pill{
      font-size:12px; color:#6366f1;
      background:#eef2ff; border:1px solid #e0e7ff;
      padding:2px 8px; border-radius:999px;
      margin-left:8px;
    }

    .divider{
      height:1px; background:#f0f0f0; margin:12px 0;
    }

    .empty{
      color:#999; font-size:12px;
      padding:4px 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Duty Dashboard</h1>
      <div class="muted">Staff and Months are collapsible.</div>
    </div>
    <div id="app"></div>
  </div>

  <script src="data.js"></script>
  <script>
    // ─────────────────────────────────────────
    // 1) Constants
    // ─────────────────────────────────────────
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function zero() { return { weekday:0, weekend:0, ph:0 }; }

    function add(a, b) {
      return {
        weekday: (a.weekday||0) + (b.weekday||0),
        weekend: (a.weekend||0) + (b.weekend||0),
        ph:      (a.ph||0)      + (b.ph||0)
      };
    }

    // Fill all 12 months for a staff member (missing → zeros)
    function fullMonths(staff) {
      const map = new Map((staff.months||[]).map(m => [m.name, m]));
      return MONTHS.map(name => {
        const m = map.get(name);
        return { name, weekday: m?.weekday??0, weekend: m?.weekend??0, ph: m?.ph??0 };
      });
    }

    function staffTotal(staff) {
      return fullMonths(staff).reduce((acc, m) => add(acc, m), zero());
    }

    function monthTotal(yearObj, monthName) {
      return (yearObj.staff||[]).reduce((acc, s) => {
        const m = fullMonths(s).find(x => x.name === monthName) || zero();
        return add(acc, m);
      }, zero());
    }

    function yearTotal(yearObj) {
      return MONTHS.reduce((acc, name) => add(acc, monthTotal(yearObj, name)), zero());
    }

    // ─────────────────────────────────────────
    // 4) Expand state
    // ─────────────────────────────────────────
    const open = new Set(["year:2026"]);

    // ─────────────────────────────────────────
    // 5) Render helpers
    // ─────────────────────────────────────────
    function metricsHTML(m) {
      if (!m) return "";
      return `<div class="metrics">
        <span class="chip chip-wd">${m.weekday??0}</span>
        <span class="chip chip-we">${m.weekend??0}</span>
        <span class="chip chip-ph">${m.ph??0}</span>
      </div>`;
    }

    function rowHTML({ id, indent, title, metrics, expandable, childrenHTML }) {
      const expanded = open.has(id);

      return `
        <div class="row ${expandable ? "clickable" : ""} indent-${indent}" data-id="${id}">
          <div class="chev${expandable && expanded ? " open" : ""}">${expandable ? "▶" : ""}</div>
          <div class="${indent === 0 ? "title" : "subtitle"}">${title}</div>
          ${metricsHTML(metrics)}
        </div>
        ${expandable
          ? `<div class="children ${expanded ? "" : "hidden"}" data-children="${id}">
               ${childrenHTML || ""}
             </div>`
          : ""}
      `;
    }

    // ─────────────────────────────────────────
    // 5b) Avatar helpers
    // ─────────────────────────────────────────
    const AVATAR_COLORS = ["#6366f1","#8b5cf6","#ec4899","#14b8a6","#f59e0b","#10b981","#3b82f6"];
    function avatarColor(name) {
      let h = 0;
      for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function avatarHTML(name) {
      return `<span class="avatar" style="background:${avatarColor(name)}">${name[0].toUpperCase()}</span>`;
    }

    // ─────────────────────────────────────────
    // 6) Build HTML per year
    // ─────────────────────────────────────────
    function buildYearHTML(y) {
      const yid = `year:${y.year}`;

      // ── Total Duties row ──────────────────
      const totalRow = rowHTML({
        id: `${yid}:total`,
        indent: 1,
        title: "Total Duties",
        metrics: yearTotal(y),
        expandable: false
      });

      // ── Staff group ───────────────────────
      const staffChildrenHTML = (y.staff||[]).map(s => {
        const sid = `${yid}:staff:${s.name}`;
        const monthRows = fullMonths(s).map(m => rowHTML({
          id: `${sid}:m:${m.name}`,
          indent: 3,
          title: m.name,
          metrics: { weekday: m.weekday, weekend: m.weekend, ph: m.ph },
          expandable: false
        })).join("");

        return rowHTML({
          id: sid,
          indent: 2,
          title: s.name,
          metrics: staffTotal(s),
          expandable: true,
          childrenHTML: monthRows
        });
      }).join("") || `<div class="empty indent-2">(no staff data)</div>`;

      const staffGroupRow = rowHTML({
        id: `${yid}:staff`,
        indent: 1,
        title: `Staff <span class="pill">${(y.staff||[]).length}</span>`,
        metrics: null,
        expandable: true,
        childrenHTML: staffChildrenHTML
      });

      // ── Months group ──────────────────────  ← NEW WRAPPER
      const monthChildrenHTML = MONTHS.map(name => {
        const mid = `${yid}:month:${name}`;
        const totals = monthTotal(y, name);

        // Staff rows inside each month
        const staffRowsHTML = (y.staff||[]).map(s => {
          const m = fullMonths(s).find(x => x.name === name) || zero();
          return rowHTML({
            id: `${mid}:s:${s.name}`,
            indent: 3,
            title: s.name,
            metrics: { weekday: m.weekday, weekend: m.weekend, ph: m.ph },
            expandable: false
          });
        }).join("") || `<div class="empty indent-3">(no staff data)</div>`;

        return rowHTML({
          id: mid,
          indent: 2,
          title: name,
          metrics: totals,
          expandable: true,
          childrenHTML: staffRowsHTML
        });
      }).join("");

      const monthsGroupRow = rowHTML({
        id: `${yid}:months`,
        indent: 1,
        title: `Months`,
        metrics: null,
        expandable: true,
        childrenHTML: monthChildrenHTML   // ← Jan–Dec live inside this group
      });

      // ── Year row (wraps everything) ───────
      return rowHTML({
        id: yid,
        indent: 0,
        title: String(y.year),
        metrics: null,
        expandable: true,
        childrenHTML: totalRow + staffGroupRow + monthsGroupRow
      });
    }

    // ─────────────────────────────────────────
    // 7) Render + event delegation
    // ─────────────────────────────────────────
    function render() {
      const app = document.getElementById("app");
      const colHeader = `<div class="col-header">
        <span></span>
        <span></span>
        <div class="col-header-labels">
          <span class="col-wd">Weekday</span>
          <span class="col-we">Weekend</span>
          <span class="col-ph">Public Holiday</span>
        </div>
      </div>`;
      app.innerHTML = colHeader + data.years.map(buildYearHTML).join('<div class="divider"></div>');

      app.onclick = e => {
        const row = e.target.closest(".row");
        if (!row) return;

        const id = row.getAttribute("data-id");
        if (!app.querySelector(`[data-children="${id}"]`)) return; // not expandable

        open.has(id) ? open.delete(id) : open.add(id);
        render();
      };
    }

    render();
  </script>
</body>
</html>
